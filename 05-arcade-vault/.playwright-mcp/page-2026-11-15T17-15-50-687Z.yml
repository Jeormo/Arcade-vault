          - paragraph [ref=f5e23]: Crecimos entre el zumbido de las máquinas, el brillo de las pantallas CRT y las iniciales de tres letras en lo alto del marcador. Muchas de esas salas cerraron, pero los juegos no tenían por qué desaparecer con ellas.
          - paragraph [ref=f5e24]: "Por eso construimos un vault: un lugar donde los clásicos se conservan, se juegan y se compiten como el primer día. Abres la página, eliges un cartucho y empiezas a jugar."
